<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Varsha Sharma - Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="Personal_Portfolio_Basics.css">
</head>

<body class="bg-light text-dark">

    <header class="text-center mt-4 mb-3">
        <h1 class="fw-bold">Varsha Sharma</h1>
        <p class="lead">Cloud Computing & DevOps Enthusiast</p>
    </header>

    <main>
        <section class="container text-center p-5">

            <!-- img-fluid makes image responsive and rounded-circle creates a circular image -->
            <img src="https://via.placeholder.com/180"
                 alt="Profile Image"
                 class="img-fluid rounded-circle profile-image">

            <h2 class="fw-bold mt-4">Hello, I'm Varsha</h2>

            <p class="mt-3">
                I am passionate about Cloud Computing, DevOps, AI,
                and building useful technology solutions.
            </p>

            <div class="mt-4 mb-3">
                <!-- Bootstrap button utilities -->
                <a href="#" class="btn btn-primary me-2">Hire Me</a>
                <a href="#" class="btn btn-dark">Download CV</a>
            </div>

        </section>

        <section class="container p-5">

            <h2 class="text-center fw-bold mb-3">Contact Me</h2>

            <form class="contact-form">

                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text"
                           id="name"
                           class="form-control"
                           placeholder="Enter your name">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email"
                           id="email"
                           class="form-control"
                           placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea id="message"
                              class="form-control"
                              rows="4"
                              placeholder="Write your message"></textarea>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary">
                        Send Message
                    </button>
                </div>

            </form>

        </section>
    </main>

    <footer class="bg-dark text-white text-center p-3 mt-4">
        <p class="mb-0">© 2026 Varsha Sharma. All Rights Reserved.</p>
    </footer>

</body>
</html>
