<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="Product_Catalog.css">
</head>

<body>

    <header class="bg-dark text-white text-center p-4">
        <h1 class="fw-bold">Tech Store</h1>
        <p class="mb-0">Explore our latest products</p>
    </header>

    <main class="container py-5">

        <h2 class="text-center fw-bold mb-4">Our Products</h2>

        <!-- .row creates the Bootstrap grid -->
        <div class="row g-4">

            <!-- col-12 = 1 column on mobile
                 col-sm-6 = 2 columns on tablets
                 col-md-3 = 4 columns on larger screens -->

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://placehold.co/400x300"
                         class="card-img-top"
                         alt="Wireless Headphones">

                    <div class="card-body text-center">
                        <h5 class="card-title">Wireless Headphones</h5>
                        <p class="price">₹2,499</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://placehold.co/400x300"
                         class="card-img-top"
                         alt="Smart Watch">

                    <div class="card-body text-center">
                        <h5 class="card-title">Smart Watch</h5>
                        <p class="price">₹3,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://placehold.co/400x300"
                         class="card-img-top"
                         alt="Bluetooth Speaker">

                    <div class="card-body text-center">
                        <h5 class="card-title">Bluetooth Speaker</h5>
                        <p class="price">₹1,799</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://placehold.co/400x300"
                         class="card-img-top"
                         alt="Gaming Mouse">

                    <div class="card-body text-center">
                        <h5 class="card-title">Gaming Mouse</h5>
                        <p class="price">₹1,299</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">© 2026 Tech Store</p>
    </footer>

</body>
</html>
