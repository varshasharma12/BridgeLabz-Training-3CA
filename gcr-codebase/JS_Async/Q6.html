
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Store Product Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }

        h2 {
            text-align: center;
            background-color: white;
            padding: 12px;
            border: 1px solid #ddd;
        }

        #product-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
        }

        .product-card {
            background-color: white;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            min-width: 0;
        }

        .product-card img {
            width: 100%;
            height: 85px;
            object-fit: contain;
        }

        .product-card h4 {
            font-size: 11px;
            min-height: 30px;
        }

        .product-card p {
            color: teal;
            font-size: 12px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            #product-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <h2>🛍️ Fake Store – Product Dashboard</h2>

    <div id="product-container">
        Loading products...
    </div>

    <script src="Q6_productFetcher.js"></script>

</body>
</html>
