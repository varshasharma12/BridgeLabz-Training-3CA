
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Form</title>

    <!-- CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .container {
            background-color: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 12px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 25px;
            margin: 10px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        #summary {
            display: none;
            text-align: left;
        }

        #error {
            color: red;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Multi-Step Registration Form</h1>

        <p id="stepNumber">Step 1 of 3</p>

        <!-- Step 1: Name -->
        <div class="step active" id="step1">

            <h2>Step 1: Enter Your Name</h2>

            <input type="text" id="name"
                   placeholder="Enter your name">

        </div>


        <!-- Step 2: Email -->
        <div class="step" id="step2">

            <h2>Step 2: Enter Your Email</h2>

            <input type="email" id="email"
                   placeholder="Enter your email">

        </div>


        <!-- Step 3: Password -->
        <div class="step" id="step3">

            <h2>Step 3: Enter Your Password</h2>

            <input type="password" id="password"
                   placeholder="Enter password">

        </div>


        <p id="error"></p>


        <!-- Navigation Buttons -->
        <div id="navigation">

            <button id="backButton" style="display:none;">
                Back
            </button>

            <button id="nextButton">
                Next
            </button>

        </div>


        <!-- Final Summary -->
        <div id="summary">

            <h2>Registration Successful!</h2>

            <h3>Your Details:</h3>

            <p id="summaryName"></p>
            <p id="summaryEmail"></p>
            <p id="summaryPassword"></p>

        </div>

    </div>


    <!-- JavaScript -->
    <script>

        let currentStep = 1;

        // Get HTML elements
        const steps = document.querySelectorAll(".step");

        const nextButton = document.getElementById("nextButton");
        const backButton = document.getElementById("backButton");

        const stepNumber = document.getElementById("stepNumber");
        const error = document.getElementById("error");

        const navigation = document.getElementById("navigation");
        const summary = document.getElementById("summary");


        // Function to display current step
        function showStep(step) {

            steps.forEach(function (item) {
                item.classList.remove("active");
            });

            document.getElementById("step" + step)
                    .classList.add("active");

            stepNumber.textContent = "Step " + step + " of 3";

            backButton.style.display =
                step === 1 ? "none" : "inline-block";

            nextButton.textContent =
                step === 3 ? "Submit" : "Next";

            error.textContent = "";
        }


        // Validate current step
        function validateStep() {

            if (currentStep === 1) {

                const name =
                    document.getElementById("name").value.trim();

                if (name.length < 3) {
                    error.textContent =
                        "Please enter a valid name (at least 3 characters).";
                    return false;
                }
            }


            if (currentStep === 2) {

                const email =
                    document.getElementById("email").value.trim();

                const emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!emailPattern.test(email)) {
                    error.textContent =
                        "Please enter a valid email address.";
                    return false;
                }
            }


            if (currentStep === 3) {

                const password =
                    document.getElementById("password").value;

                if (password.length < 8) {
                    error.textContent =
                        "Password must contain at least 8 characters.";
                    return false;
                }
            }

            return true;
        }


        // Next button functionality
        nextButton.addEventListener("click", function () {

            if (!validateStep()) {
                return;
            }

            if (currentStep < 3) {

                currentStep++;

                showStep(currentStep);

            } else {

                showSummary();
            }
        });


        // Back button functionality
        backButton.addEventListener("click", function () {

            if (currentStep > 1) {

                currentStep--;

                showStep(currentStep);
            }
        });


        // Display final summary
        function showSummary() {

            steps.forEach(function (item) {
                item.classList.remove("active");
            });

            stepNumber.style.display = "none";
            navigation.style.display = "none";

            summary.style.display = "block";

            document.getElementById("summaryName").textContent =
                "Name: " + document.getElementById("name").value;

            document.getElementById("summaryEmail").textContent =
                "Email: " + document.getElementById("email").value;

            // Do not display the actual password in the summary
            document.getElementById("summaryPassword").textContent =
                "Password: " + "*".repeat(
                    document.getElementById("password").value.length
                );
        }

    </script>

</body>
</html>
