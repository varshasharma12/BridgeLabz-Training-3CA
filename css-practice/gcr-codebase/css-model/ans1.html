<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding Demonstration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .box {
            width: 180px;
            background-color: white;
            border-color: black;
            border-width: 4px;
            padding: 20px;
            transition: border-color 0.4s ease;
        }
        .solid {
            border-style: solid;
        }

        .dashed {
            border-style: dashed;
        }

        .double {
            border-style: double;
        }

        .groove {
            border-style: groove;
        }

        .rounded {
            border-radius: 20px;
        }

        .padding-small {
            padding: 10px;
        }

        .padding-medium {
            padding: 25px;
        }

        .padding-large {
            padding: 40px;
        }

        .box:hover {
            border-color: blue;
        }
    </style>
</head>

<body>

    <h1>Borders and Padding Demonstration</h1>

    <div class="container">

        <div class="box solid rounded padding-small">
            <h2>Solid</h2>
            <p>Small Padding</p>
        </div>

        <div class="box dashed padding-medium">
            <h2>Dashed</h2>
            <p>Medium Padding</p>
        </div>

        <div class="box double rounded padding-large">
            <h2>Double</h2>
            <p>Large Padding</p>
        </div>

        <div class="box groove rounded padding-medium">
            <h2>Groove</h2>
            <p>Rounded Corners</p>
        </div>

    </div>

</body>
</html>
