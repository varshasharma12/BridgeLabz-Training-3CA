<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Section</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pricing-section {
            width: 90%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .pricing-card {
            width: 300px;
            min-height: 380px;
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: 0.3s;
            animation: fadeIn 1s ease-in;
        }

        .pricing-card:hover {
            transform: translateY(-10px);
        }

        .pricing-card h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .price {
            font-size: 35px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .pricing-card p {
            margin: 10px 0;
            font-size: 16px;
        }

        .pricing-card button {
            margin-top: 25px;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        .pricing-card button:hover {
            background-color: #555;
        }

        .popular {
            min-height: 420px;
            background-color: lightblue;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 750px) {
            body {
                padding: 30px 0;
            }

            .pricing-section {
                flex-direction: column;
            }

            .pricing-card {
                width: 90%;
                max-width: 350px;
            }
        }
    </style>
</head>

<body>

    <section class="pricing-section">

        <div class="pricing-card">
            <h2>Basic</h2>
            <div class="price">₹499</div>
            <p>5 Projects</p>
            <p>10 GB Storage</p>
            <p>Email Support</p>
            <button>Choose Plan</button>
        </div>

        <div class="pricing-card popular">
            <h2>Premium</h2>
            <div class="price">₹999</div>
            <p>20 Projects</p>
            <p>50 GB Storage</p>
            <p>Priority Support</p>
            <button>Choose Plan</button>
        </div>

        <div class="pricing-card">
            <h2>Pro</h2>
            <div class="price">₹1499</div>
            <p>Unlimited Projects</p>
            <p>100 GB Storage</p>
            <p>24/7 Support</p>
            <button>Choose Plan</button>
        </div>

    </section>

</body>
</html>
