<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        figure {
            margin: 0;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        figure img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        figure:hover img {
            transform: scale(1.05);
        }

        figcaption {
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <figure>
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7" alt="Mountain">
            <figcaption>Beautiful Mountain</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Beach">
            <figcaption>Beautiful Beach</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" alt="Forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e" alt="Lake">
            <figcaption>Peaceful Lake</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Nature">
            <figcaption>Nature View</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba" alt="Snow Mountain">
            <figcaption>Snow Mountain</figcaption>
        </figure>

    </div>

</body>
</html>
