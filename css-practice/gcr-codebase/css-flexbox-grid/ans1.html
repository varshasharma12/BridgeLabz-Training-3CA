<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 50px;
            background-color: #333;
            color: white;
        }

        header h1 {
            font-size: 28px;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        nav a:hover {
            color: lightblue;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            padding: 50px;
        }

        .about {
            flex: 1;
            max-width: 500px;
        }

        .about h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .about p {
            font-size: 18px;
            line-height: 1.6;
        }

        .image-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-box {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: lightblue;
            font-size: 70px;
            font-weight: bold;
        }

        footer {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #333;
            color: white;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            nav {
                flex-direction: column;
                gap: 10px;
                align-items: center;
            }

            main {
                flex-direction: column;
                text-align: center;
                padding: 30px 20px;
            }

            .about {
                max-width: 100%;
            }

            .profile-box {
                width: 220px;
                height: 220px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Varsha Sharma</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Skills</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <section class="about">
            <h2>About Me</h2>
            <p>
                Hello! I am Varsha Sharma, a Computer Science student
                interested in Web Development, Cloud Computing and DevOps.
                I enjoy learning new technologies and building useful projects.
            </p>
        </section>

        <section class="image-section">
            <div class="profile-box">VS</div>
        </section>
    </main>

    <footer>
        <p>© 2026 Varsha Sharma. All Rights Reserved.</p>
    </footer>

</body>
</html>
