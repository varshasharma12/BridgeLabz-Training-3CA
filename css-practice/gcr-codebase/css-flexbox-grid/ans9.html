<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            perspective: 1000px;
        }

        .card-container {
            width: 300px;
            height: 400px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
        }

        .card-container:hover .card {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .card-front {
            background-color: white;
        }

        .card-front img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .card-front h2 {
            padding: 20px;
            font-size: 26px;
        }

        .card-back {
            background-color: lightblue;
            padding: 30px;
            transform: rotateY(180deg);
        }

        .card-back h2 {
            margin-bottom: 20px;
        }

        .card-back p {
            font-size: 17px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="card-container">

        <div class="card">

            <div class="card-front">
                <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3" alt="Technology">
                <h2>Web Development</h2>
            </div>

            <div class="card-back">
                <h2>About</h2>
                <p>
                    Web development is the process of creating websites
                    using technologies like HTML, CSS and JavaScript.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
