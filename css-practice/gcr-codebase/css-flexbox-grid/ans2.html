<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .product-gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .product-card {
            background-color: white;
            height: 350px;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: 0.3s;
        }

        .product-card:hover {
            transform: scale(1.05);
        }

        .product-card img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .product-card h2 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        .product-card p {
            font-size: 18px;
            font-weight: bold;
        }

        @media (max-width: 900px) {
            .product-gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .product-gallery {
                grid-template-columns: 1fr;
            }

            body {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <h1>Product Gallery</h1>

    <div class="product-gallery">

        <div class="product-card">
            <img src="https://media.tatacroma.com/Croma%20Assets/Computers%20Peripherals/Laptop/Images/319623_0_MJMlel-zt.png?updatedAt=1784808422708" alt="Laptop">
            <h2>Laptop</h2>
            <p>₹55,000</p>
        </div>

        <div class="product-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToncAIJys5plV9iV7816jdV2XEGihuSRAhrEWX7ZCRgY6pGLD2ORlxWOM&s=10" alt="Smartphone">
            <h2>Smartphone</h2>
            <p>₹25,000</p>
        </div>

        <div class="product-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRurqdIRSAmDV9aESEiXICiEF0qDStjmEbq9QYjYNw1Rw&s=10" alt="Headphones">
            <h2>Headphones</h2>
            <p>₹2,500</p>
        </div>

        <div class="product-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSvM2KpMGYNR097AIHlQUtpcig9hMY3RoFa6wmsg9wdTw&s=10" alt="Smart Watch">
            <h2>Smart Watch</h2>
            <p>₹4,000</p>
        </div>

        <div class="product-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTvsl5vh1rhHxAfiuQOtdJj6_rhb4_IxXCJqBKOp0hdKQ&s=10" alt="Keyboard">
            <h2>Keyboard</h2>
            <p>₹1,500</p>
        </div>

        <div class="product-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQS6NF00QdOaHHlYQnneCI4lpeTXHqAjC89uIh0W2HqAA&s=10" alt="Mouse">
            <h2>Mouse</h2>
            <p>₹800</p>
        </div>

        <div class="product-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTrJ46ZJlgSdAgvKH33FLB9cYXUaK0kV9dxUcqeNr1lSA&s" alt="Tablet">
            <h2>Tablet</h2>
            <p>₹18,000</p>
        </div>

        <div class="product-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRnrO0PHEm5aFnQXhUo1UE0xHwq2oE1WIsxTuada9EXHj73FdiNNFwZ6u-T&s=10" alt="Speaker">
            <h2>Speaker</h2>
            <p>₹3,000</p>
        </div>

    </div>

</body>
</html>
