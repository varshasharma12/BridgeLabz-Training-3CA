<!DOCTYPE html>
<html>
<head>
    <title>User Interface Components</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #f3e8ff);
        }

        .card {
            width: 500px;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            text-align: center;
            margin: 0 0 10px;
            color: #333;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #6c63ff;
            box-shadow: 0 0 5px rgba(108, 99, 255, 0.4);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #6c63ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        button:hover {
            background: #5148d8;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        select {
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .secondary {
            background: #555;
        }

        .secondary:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>UI Components</h1>

        <div class="search-box">
            <input type="text" placeholder="Search here...">
            <button>Search</button>
        </div>

        <select>
            <option>Select a category</option>
            <option>Technology</option>
            <option>Education</option>
            <option>Design</option>
            <option>Business</option>
        </select>

        <div class="buttons">
            <button>Submit</button>
            <button class="secondary">Cancel</button>
        </div>

    </div>

</body>
</html>
