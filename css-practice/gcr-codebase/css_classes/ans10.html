<!DOCTYPE html>
<html>
<head>
    <title>Mini User Interface</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #f3e8ff);
            display: flex;
            flex-direction: column;
        }

        header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            margin: 0;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card {
            width: 500px;
            background: white;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #4f46e5;
            object-fit: cover;
            margin-bottom: 20px;
        }

        .card h2 {
            margin: 5px 0 20px;
            color: #333;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            color: #444;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 6px rgba(79, 70, 229, 0.4);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 5px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        button:hover {
            background: #3730a3;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .cancel {
            background: #777;
        }

        .cancel:hover {
            background: #555;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }

        footer p {
            margin: 0;
        }

        @media (max-width: 600px) {
            main {
                padding: 25px 15px;
            }

            .card {
                width: 100%;
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
                width: 100%;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Mini UI</h1>
    </header>

    <main>

        <div class="card">

            <img src="profile.jpeg" alt="Profile Image">

            <h2>Contact Form</h2>

            <form>

                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">

                <label for="message">Message</label>
                <textarea id="message" rows="4" placeholder="Enter your message"></textarea>

                <div class="buttons">
                    <button type="submit">Submit</button>
                    <button type="reset" class="cancel">Reset</button>
                </div>

            </form>

        </div>

    </main>

    <footer>
        <p>© 2026 My Mini UI | All Rights Reserved</p>
    </footer>

</body>
</html>
