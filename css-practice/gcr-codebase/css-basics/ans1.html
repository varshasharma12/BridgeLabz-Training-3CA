<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f2f6fc;
            color: #222;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            background-color: #1f3c88;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            z-index: 1000;
        }

        header h1 {
            font-size: 1.8rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 2em;
        }

        main {
            flex: 1;
            min-height: 80vh;
            padding: 120px 10% 50px;
        }

        .intro {
            width: 80%;
            margin: auto;
            text-align: center;
        }

        .intro h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .intro p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .profile {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
        }

        footer {
            height: 10vh;
            background-color: #1f3c88;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
        }
    </style>
</head>

<body>

    <header>
        <h1>Varsha Sharma</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <section class="intro">

            <img src="profile.jpg" alt="Profile Image" class="profile">

            <h2>Welcome to My Portfolio</h2>

            <p>
                Hello! My name is Varsha Sharma. I am a Computer Science
                student interested in Cloud Computing, DevOps and Web Development.
                I enjoy learning new technologies and creating useful projects.
            </p>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Varsha Sharma</p>
    </footer>

</body>
</html>
