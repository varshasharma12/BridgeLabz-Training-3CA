<!DOCTYPE html>
<html>
<head>
    <title>Team Members</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .team {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .card {
            background-color: white;
            width: 30%;
            padding: 20px;
            margin: 10px;
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 0 4px 8px gray;
            text-align: center;
        }

        .lead {
            background-color: #d9eaff;
            border: 3px solid blue;
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .card p {
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .team {
                flex-direction: column;
            }

            .card {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <h1>Our Team Members</h1>

    <div class="team">

        <div class="card lead">
            <h2>Varsha Sharma</h2>
            <h3>Team Lead</h3>
            <p>
                Varsha leads the team and manages the project activities.
            </p>
        </div>

        <div class="card">
            <h2>Rahul</h2>
            <h3>Developer</h3>
            <p>
                Rahul works on developing and maintaining the website.
            </p>
        </div>

        <div class="card">
            <h2>Priya</h2>
            <h3>Designer</h3>
            <p>
                Priya designs the user interface and creates creative layouts.
            </p>
        </div>

    </div>

</body>
</html>
