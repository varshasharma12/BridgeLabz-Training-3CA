<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="ans8.css">
</head>
<body>

    <header>
        <h1>Filter Comparison</h1>
        <p>Compare the original and filtered images</p>
    </header>

    <main>
        <section class="comparison">

            <div class="image-box">
                <img src="https://picsum.photos/id/1015/500/350" alt="Original mountain image">
                <h2>Before</h2>
                <p>Original Image</p>
            </div>

            <div class="image-box">
                <img class="filtered" src="https://picsum.photos/id/1015/500/350" alt="Filtered mountain image">
                <h2>After</h2>
                <p>Brightness Filter</p>
            </div>

        </section>
    </main>

    <footer>
        <p>Filter Comparison Layout</p>
    </footer>

</body>
</html>
