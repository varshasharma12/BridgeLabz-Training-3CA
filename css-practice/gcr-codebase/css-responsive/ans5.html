<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="ans5.css">
</head>
<body>

    <header>
        <h1>Our Team</h1>
    </header>

    <main>
        <section class="cards">

            <div class="card">
                <img class="grayscale" src="https://picsum.photos/id/64/300/250" alt="Profile">
                <h2>Alex</h2>
                <p>Web Designer</p>
            </div>

            <div class="card">
                <img class="sepia" src="https://picsum.photos/id/91/300/250" alt="Profile">
                <h2>John</h2>
                <p>Developer</p>
            </div>

            <div class="card">
                <img class="grayscale" src="https://picsum.photos/id/177/300/250" alt="Profile">
                <h2>Sarah</h2>
                <p>UI Designer</p>
            </div>

        </section>
    </main>

</body>
</html>
