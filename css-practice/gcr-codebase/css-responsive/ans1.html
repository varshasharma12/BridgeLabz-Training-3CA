<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="ans1.css">
</head>
<body>

    <header>
        <h1>Responsive Image Filter Gallery</h1>
        <p>Hover over an image to remove its filter.</p>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <img class="blur" src="https://picsum.photos/id/1015/500/350" alt="Mountain landscape">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <figure>
                <img class="grayscale" src="https://picsum.photos/id/1016/500/350" alt="Nature landscape">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <figure>
                <img class="sepia" src="https://picsum.photos/id/1025/500/350" alt="Dog">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <figure>
                <img class="brightness" src="https://picsum.photos/id/1035/500/350" alt="River and mountains">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <figure>
                <img class="contrast" src="https://picsum.photos/id/1043/500/350" alt="Forest">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <figure>
                <img class="hue-rotate" src="https://picsum.photos/id/1069/500/350" alt="Beach">
                <figcaption>Hue-Rotate Filter</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>CSS Image Filter Gallery</p>
    </footer>

</body>
</html>
