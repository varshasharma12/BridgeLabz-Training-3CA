<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Selection</title>
</head>
<body>

    <h1>Select Your Preferences</h1>
    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>USA</option>
        <option>Japan</option>
        <option>Australia</option>
    </select>

    <br><br>
    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Maharashtra</option>
        <option>Gujarat</option>
    </select>

    <br><br>
    <label for="city">City:</label>
    <select id="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Jaipur</option>
        <option>Mumbai</option>
    </select>

    <br><br>
    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Mussorie</option>
        <option>Jaipur</option>
        <option>Kashmir</option>
        <option>Manali</option>
    </select>

    <p>
        My choices are: Country - India, State - Uttar Pradesh,
        City - Mathura, Favorite Tourist Place - Mussoorie.
    </p>

</body>
</html>
