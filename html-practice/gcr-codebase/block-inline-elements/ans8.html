<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report</title>
</head>

<body>

    <h1>Delhi Public School</h1>
    <h2>Student Report Card</h2>

    <table border="1" cellpadding="10">
        <tr>
            <th rowspan="2" title="Student information">Student Details</th>
            <th>Name</th>
            <td>Varsha Sharma</td>
        </tr>

        <tr>
            <th>Class</th>
            <td>12th</td>
        </tr>
        <tr>
            <th colspan="3" title="Marks obtained in five subjects">
                Subject Marks
            </th>
        </tr>

        <tr>
            <th>Subject</th>
            <th>Maximum Marks</th>
            <th>Marks Obtained</th>
        </tr>

        <tr>
            <td title="Subject: Mathematics">Mathematics</td>
            <td>100</td>
            <td>85</td>
        </tr>

        <tr>
            <td title="Subject: Computer Science">Computer Science</td>
            <td>100</td>
            <td>90</td>
        </tr>

        <tr>
            <td title="Subject: Physics">Physics</td>
            <td>100</td>
            <td>78</td>
        </tr>

        <tr>
            <td title="Subject: English">English</td>
            <td>100</td>
            <td>82</td>
        </tr>

        <tr>
            <td title="Subject: Chemistry">Chemistry</td>
            <td>100</td>
            <td>88</td>
        </tr>
        <tr>
            <th colspan="2" title="Total marks">
                Total
            </th>
            <td>423 / 500</td>
        </tr>

        <tr>
            <th colspan="2" title="Percentage">
                Percentage
            </th>
            <td>84.6%</td>
        </tr>
    </table>

</body>
</html>
